<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Interview · BLKOUT Voices</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;900&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Guest interview for BLKOUT Voices (25 Nov 2026). A private link: the part of the address after # is the guest's key.
  It is never sent to this server (fragments are not), only to the interview API at ivor.blkoutuk.cloud.
  API and questions: ivor-core src/api/guestInterviewRoutes.ts, src/services/guestInterview.ts.
-->
<style>
  :root { --ground:#0a0a14; --card:#14141f; --line:#2c2c3a; --cream:#f5f1e8; --soft:#a8a195; --gold:#FFD700; --gold-deep:#D4AF37; --voices:#00a86b; --voices-lit:#00d68f; --warn:#ff8c00; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--ground); color:var(--cream); font:400 17px/1.55 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 20px calc(48px + env(safe-area-inset-bottom)); }
  header.top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding: 8px 0 28px; }
  .wordmark { font-weight:900; letter-spacing:.02em; text-transform:uppercase; font-size:18px; color:var(--cream); text-decoration:none; }
  .wordmark b { color:var(--voices); }
  .label { font:500 12px/1.3 'IBM Plex Mono', ui-monospace, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--voices-lit); }
  .label.quiet { color:var(--soft); }
  h1 { font-weight:900; text-transform:uppercase; letter-spacing:.01em; font-size: clamp(30px, 8vw, 56px); line-height:1.05; margin: 10px 0 16px; }
  .question { font: italic 500 clamp(24px, 6.2vw, 32px)/1.28 'Fraunces', Georgia, serif; margin: 12px 0 20px; }
  p { margin: 0 0 14px; }
  .soft { color:var(--soft); }
  .small { font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin: 16px 0; }
  textarea, input[type=text] { width:100%; background:var(--card); color:var(--cream); border:1.5px solid #55556a; border-radius:14px; padding:14px; font: inherit; line-height:1.5; }
  textarea { min-height: 190px; resize: vertical; }
  textarea:focus, input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--voices-lit); outline-offset: 3px; }
  textarea::placeholder, input::placeholder { color:#8f8c96; opacity:1; }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; border-radius:999px; border:1.5px solid transparent; font:600 17px/1.2 'Work Sans', sans-serif; cursor:pointer; padding: 12px 20px; text-align:center; }
  .btn.gold { background:var(--gold); color:var(--ground); }
  .btn.gold:disabled { background: rgba(255,215,0,.35); color:var(--ground); cursor:not-allowed; }
  .linkbtn { background:none; border:0; color:var(--soft); font: inherit; font-size:15px; text-decoration:underline; text-underline-offset:4px; cursor:pointer; min-height:44px; padding: 0; text-align:left; }
  .row { display:flex; gap:16px; justify-content:space-between; align-items:center; margin-top: 6px; }
  .row .linkbtn:last-child { text-align:right; }
  .stack > * + * { margin-top: 12px; }
  .progress { display:flex; gap:5px; margin: 8px 0 22px; }
  .progress i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .progress i.done { background: rgba(245,241,232,.55); } .progress i.now { background:var(--voices-lit); }
  .ivor { border-left:3px solid var(--voices); padding: 2px 0 2px 16px; margin: 22px 0 14px; }
  .ivor .question { font-size: clamp(20px, 5.4vw, 25px); margin: 6px 0 0; }
  .mine { white-space: pre-wrap; background:var(--card); border-radius:14px; padding:14px; margin: 0 0 6px; border:1px solid var(--line); }
  .status { font:400 13px/1.4 'IBM Plex Mono', monospace; color:var(--soft); margin-top: 8px; }
  .hint { font-size:14px; color:var(--soft); margin: 8px 0 0; }
  .asked { font: italic 400 17px/1.4 'Fraunces', Georgia, serif; color:var(--soft); margin: 0 0 16px; }
  .unans { display:flex; gap:12px; align-items:baseline; justify-content:space-between; border-top:1px solid var(--line); padding: 10px 0; }
  .unans span { color:var(--soft); font-size:15px; }
  .unans .linkbtn { flex-shrink:0; min-height:44px; }
  @media (min-width: 800px) { .wrap { padding-top: 48px; } header.top { padding-bottom: 56px; } .wordmark { font-size:22px; } }
  .status.bad { color:var(--warn); }
  .review h2 { font: italic 500 20px/1.3 'Fraunces', Georgia, serif; margin: 0 0 10px; }
  .review .a { white-space: pre-wrap; margin: 0 0 8px; }
  .review .fu { color:var(--soft); margin: 12px 0 6px; font-size:15px; }
  .empty { color:var(--soft); font-style: italic; }
  footer { margin-top: 40px; padding-top: 18px; border-top:1px solid var(--line); color:var(--soft); font-size:14px; }
  footer a, p a { color:var(--voices-lit); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="wordmark" href="https://voices.blkoutuk.com/">BLKOUT<b>.</b> Voices</a>
  </header>
  <main id="app" aria-live="polite"><p class="soft">One moment…</p></main>
  <footer>
    <p>BLKOUT Voices is the magazine of BLKOUT, a community-owned platform for and by Black queer men in the UK. Questions about this interview: <a href="mailto:rob@blkoutuk.com">rob@blkoutuk.com</a></p>
  </footer>
</div>
<script>
(() => {
  'use strict'
  const qs = new URLSearchParams(location.search)
  // Local testing only: ?api=http://localhost:PORT. Anything else is ignored.
  const apiParam = qs.get('api') || ''
  const API = (/^http:\/\/localhost:\d+$/.test(apiParam) ? apiParam : 'https://ivor.blkoutuk.cloud') + '/api/guest-interview/'
  const token = decodeURIComponent(location.hash.replace(/^#/, ''))
  const app = document.getElementById('app')
  const LS = 'voices.interview.' + token.slice(0, 12)

  let data = null          // { title, intro, questions, guestName, status }
  let entries = []         // one per question: { q, answer, follow_up, follow_up_answer, skipped, checked }
  let bio = ''
  let at = 0               // question index being shown
  let saveState = ''       // '', 'saving', 'saved', 'failed'

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const words = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0)
  const totalWords = () => entries.reduce((n, e) => n + words(e.answer) + words(e.follow_up_answer), 0)
  const entry = (i) => entries[i]
  const answered = (e) => !!(e.answer.trim() || e.follow_up_answer.trim())

  async function call(path, method, body) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 45000)
    try {
      const res = await fetch(API + encodeURIComponent(token) + path, {
        method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal,
      })
      const json = await res.json().catch(() => null)
      return { ok: res.ok, status: res.status, json }
    } catch (e) { return { ok: false, status: 0, json: null } } finally { clearTimeout(t) }
  }

  const payload = () => ({ transcript: entries.filter((e) => answered(e) || e.skipped).map((e) => ({ q: e.q, answer: e.answer, follow_up: e.follow_up, follow_up_answer: e.follow_up_answer, skipped: e.skipped })), bio })
  const keepLocal = () => { try { localStorage.setItem(LS, JSON.stringify({ entries, bio, at })) } catch (e) { /* private mode: the server copy is the record */ } }

  async function save() {
    keepLocal(); saveState = 'saving'; paintStatus()
    const r = await call('', 'PUT', payload())
    saveState = r.ok ? 'saved' : 'failed'; paintStatus()
    return r.ok
  }
  function paintStatus() {
    const el = document.getElementById('status'); if (!el) return
    el.className = 'status' + (saveState === 'failed' ? ' bad' : '')
    el.textContent = saveState === 'saving' ? 'Saving…' : saveState === 'saved' ? 'Saved. You can close this page and come back to the same link.'
      : saveState === 'failed' ? 'Not saved just now. Your answers are still on this device; carry on, and we’ll try again.' : ''
  }

  // ---------- screens ----------
  function screenProblem(kind) {
    app.innerHTML = kind === 'link'
      ? `<p class="label">Interview</p><h1>This link isn’t working</h1><p>It may have been cut short when it was copied. Open it again from Rob’s email, or write to <a href="mailto:rob@blkoutuk.com">rob@blkoutuk.com</a> and he’ll send a fresh one.</p>`
      : `<p class="label">Interview</p><h1>We can’t reach the interview just now</h1><p>Nothing is lost. Check your connection and try again in a moment.</p><button class="btn gold" id="retry">Try again</button>`
    const b = document.getElementById('retry'); if (b) b.onclick = boot
  }

  function screenWelcome() {
    const started = entries.some(answered)
    app.innerHTML = `
      <p class="label">BLKOUT Voices · Interview</p>
      <h1>Hello, ${esc(data.guestName)}</h1>
      <div class="stack">${data.intro.map((p) => `<p>${esc(p)}</p>`).join('')}
        <p>You can talk instead of typing: on a phone, tap the microphone on your keyboard and your words appear in the box for you to check.</p></div>
      <div class="card small soft stack">
        <p><strong style="color:var(--cream)">Where this goes.</strong> The interview is published on BLKOUT Voices before Joseph Beam Day (Monday 28 December). It is part of Portaul’s sponsorship of the Ivor’s Compass journal, and the article will say so. BLKOUT chose the questions and edits the piece for length and clarity.</p>
        <p><strong style="color:var(--cream)">Who sees your answers.</strong> Only the BLKOUT editorial team. Please leave out anyone’s personal health details, including your own.</p>
      </div>
      <button class="btn gold" id="go">${started ? 'Carry on where I left off' : 'Start'}</button>
      ${started ? '<div class="row" style="justify-content:center"><button class="linkbtn" id="rev">See what I’ve written so far</button></div>' : ''}`
    document.getElementById('go').onclick = () => { const next = entries.findIndex((e) => !answered(e) && !e.skipped); at = next < 0 ? entries.length : next; next < 0 ? screenReview() : screenQuestion() }
    const rv = document.getElementById('rev'); if (rv) rv.onclick = screenReview
  }

  function progress() {
    return `<div class="progress" role="img" aria-label="Question ${at + 1} of ${entries.length}">${entries.map((e, i) => `<i class="${i === at ? 'now' : answered(e) || e.skipped ? 'done' : ''}"></i>`).join('')}</div>`
  }

  function screenQuestion() {
    const e = entry(at); const last = at === entries.length - 1
    window.scrollTo(0, 0)
    app.innerHTML = `
      <p class="label">Question ${at + 1} of ${entries.length}</p>
      ${progress()}
      <h1 class="sr">Question ${at + 1} of ${entries.length}</h1>
      <p class="question">${esc(data.questions[at])}</p>
      <label class="label quiet" for="answer">Your answer</label>
      <textarea id="answer" placeholder="Type here, or tap the microphone on your keyboard and talk.">${esc(e.answer)}</textarea>
      <p class="hint">Type, or tap the microphone on your keyboard to talk.</p>
      <div class="stack" style="margin-top:14px">
        <button class="btn gold" id="next">${last ? 'Save and finish' : 'Save and continue'}</button>
      </div>
      <div class="row">
        ${at > 0 ? '<button class="linkbtn" id="back">← Previous question</button>' : '<span></span>'}
        <button class="linkbtn" id="skip">Skip this one</button>
      </div>
      <p class="status" id="status"></p>`
    paintStatus()
    const ta = document.getElementById('answer')
    ta.oninput = () => { e.answer = ta.value; keepLocal() }
    document.getElementById('skip').onclick = async () => { e.answer = ta.value; e.skipped = !e.answer.trim(); await save(); advance() }
    const bk = document.getElementById('back'); if (bk) bk.onclick = () => { e.answer = ta.value; keepLocal(); at--; screenQuestion() }
    document.getElementById('next').onclick = async () => {
      e.answer = ta.value
      if (!e.answer.trim()) { e.skipped = true; await save(); return advance() }
      e.skipped = false
      const btn = document.getElementById('next'); btn.disabled = true; btn.textContent = 'Ivor is reading your answer…'
      const saving = save()
      // One follow-up per answer, asked once: a changed answer is not followed up again unless the first check found nothing.
      if (!e.follow_up && e.checked !== e.answer) {
        const r = await call('/follow-up', 'POST', { questionIndex: at, answer: e.answer })
        e.checked = e.answer
        if (r.ok && r.json && typeof r.json.followUp === 'string' && r.json.followUp.trim()) e.follow_up = r.json.followUp.trim()
      }
      await saving; keepLocal()
      e.follow_up ? screenFollowUp() : advance()
    }
  }

  function screenFollowUp() {
    const e = entry(at)
    app.innerHTML = `
      <p class="label">Question ${at + 1} of ${entries.length} · a follow-up</p>
      ${progress()}
      <h1 class="sr">A follow-up to question ${at + 1}</h1>
      <p class="asked">${esc(data.questions[at])}</p>
      <p class="label quiet">You said</p>
      <p class="mine">${esc(e.answer)}</p>
      <div class="ivor"><p class="label">Ivor asks</p><p class="question">${esc(e.follow_up)}</p></div>
      <label class="label quiet" for="fu">Your answer</label>
      <textarea id="fu" style="min-height:150px" placeholder="Type here, or tap the microphone on your keyboard and talk.">${esc(e.follow_up_answer)}</textarea>
      <p class="hint">Type, or tap the microphone on your keyboard to talk. The follow-up is optional.</p>
      <div class="stack" style="margin-top:14px"><button class="btn gold" id="next">Save and continue</button></div>
      <div class="row">
        <button class="linkbtn" id="back">← My first answer</button>
        <button class="linkbtn" id="skip">Skip the follow-up</button>
      </div>
      <p class="status" id="status"></p>`
    paintStatus()
    const ta = document.getElementById('fu'); ta.oninput = () => { e.follow_up_answer = ta.value; keepLocal() }
    ta.scrollIntoView({ block: 'center' })
    document.getElementById('back').onclick = () => { e.follow_up_answer = ta.value; keepLocal(); screenQuestion() }
    document.getElementById('skip').onclick = async () => { e.follow_up_answer = ''; await save(); advance() }
    document.getElementById('next').onclick = async () => { e.follow_up_answer = ta.value; document.getElementById('next').disabled = true; await save(); advance() }
  }

  function advance() { if (at < entries.length - 1) { at++; keepLocal(); screenQuestion() } else screenReview() }

  function screenReview() {
    window.scrollTo(0, 0)
    const sent = data.status === 'submitted'
    const n = totalWords(); const some = entries.some(answered)
    const unansweredCount = entries.filter((e) => !e.answer.trim()).length
    const answeredOrOpen = (e) => !sent || e.answer.trim()
    app.innerHTML = `
      <p class="label">${sent ? 'Sent to BLKOUT' : 'Read it back'}</p>
      <h1>${sent ? 'Thank you' : 'Your answers'}</h1>
      ${sent
        ? '<p>Your answers are with BLKOUT. We’ll send you the edited text before anything is published. If you want to change something, write to <a href="mailto:rob@blkoutuk.com">rob@blkoutuk.com</a>.</p>'
        : `<p class="soft">About ${n} words so far${n ? (n < 400 ? ': 400 to 800 is plenty, so there’s room for more if you want it.' : n > 900 ? ': more than we need, which is fine. We’ll edit for length.' : ': a good length.') : '.'} Change anything before you send.</p>`}
      ${!sent && some ? '<p><button class="linkbtn" id="tosend" style="color:var(--voices-lit)">Go to send ↓</button></p>' : ''}
      <div class="review">${entries.filter(answeredOrOpen).map((e) => { const i = e.q; return e.answer.trim() ? `
        <div class="card">
          <p class="label quiet">Question ${i + 1}</p>
          <h2>${esc(data.questions[i])}</h2>
          <p class="a">${esc(e.answer)}</p>
          ${e.follow_up && e.follow_up_answer.trim() ? `<p class="fu">Ivor asked: ${esc(e.follow_up)}</p><p class="a">${esc(e.follow_up_answer)}</p>` : ''}
          ${sent ? '' : `<button class="linkbtn" data-edit="${i}">Change this answer</button>`}
        </div>` : `
        <div class="unans"><span>${i + 1}. ${esc(data.questions[i])}</span><button class="linkbtn" data-edit="${i}">Answer</button></div>` }).join('')}</div>
      ${sent && unansweredCount ? `<p class="soft small">${unansweredCount} ${unansweredCount === 1 ? 'question was' : 'questions were'} left unanswered, which is fine.</p>` : ''}
      ${sent ? '' : `
      <div class="card stack">
        <label class="label quiet" for="bio">One line about you, for the article</label>
        <input type="text" id="bio" maxlength="300" value="${esc(bio)}" placeholder="Name and role">
        <p class="small soft">A photograph too, please: landscape, at least 1,600 pixels wide, with the photographer’s name if a credit is due. Email it to <a href="mailto:rob@blkoutuk.com">rob@blkoutuk.com</a>.</p>
      </div>
      <button class="btn gold" id="send" ${some ? '' : 'disabled'}>Send my answers to BLKOUT</button>
      ${some ? '' : '<p class="small soft" style="text-align:center;margin-top:10px">Answer at least one question to send.</p>'}
      <p class="status" id="status"></p>`}`
    app.querySelectorAll('[data-edit]').forEach((b) => { b.onclick = () => { at = Number(b.dataset.edit); screenQuestion() } })
    if (sent) return
    const ts = document.getElementById('tosend'); if (ts) ts.onclick = () => document.getElementById('send').scrollIntoView({ behavior: 'smooth', block: 'center' })
    const bi = document.getElementById('bio'); bi.oninput = () => { bio = bi.value; keepLocal() }
    document.getElementById('send').onclick = async () => {
      const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Sending…'
      const r = await call('/submit', 'POST', payload())
      if (r.ok) { data.status = 'submitted'; try { localStorage.removeItem(LS) } catch (e) { /* nothing to clear */ } screenReview() }
      else { btn.disabled = false; btn.textContent = 'Send my answers to BLKOUT'; saveState = 'failed'; const el = document.getElementById('status'); el.className = 'status bad'; el.textContent = 'That didn’t send. Your answers are safe on this device: check your connection and tap Send again.' }
    }
  }

  // ---------- start ----------
  async function boot() {
    if (!/^[A-Za-z0-9_-]{32,80}$/.test(token)) return screenProblem('link')
    app.innerHTML = '<p class="soft">One moment…</p>'
    const r = await call('', 'GET')
    if (r.status === 404) return screenProblem('link')
    if (!r.ok || !r.json) return screenProblem('reach')
    data = r.json
    document.title = data.title + ' · BLKOUT Voices'
    const saved = Array.isArray(data.transcript) ? data.transcript : []
    entries = data.questions.map((_, i) => {
      const s = saved.find((x) => x && x.q === i) || {}
      return { q: i, answer: s.answer || '', follow_up: s.follow_up || null, follow_up_answer: s.follow_up_answer || '', skipped: !!s.skipped, checked: s.follow_up ? s.answer : undefined }
    })
    bio = data.bio || ''
    // Anything typed on this device and not yet saved to the server wins over an older server copy.
    if (data.status !== 'submitted') {
      try {
        const local = JSON.parse(localStorage.getItem(LS) || 'null')
        if (local && Array.isArray(local.entries) && local.entries.length === entries.length) {
          local.entries.forEach((l, i) => { if (l && (words(l.answer || '') + words(l.follow_up_answer || '')) >= (words(entries[i].answer) + words(entries[i].follow_up_answer))) entries[i] = { ...entries[i], ...l, q: i } })
          if (typeof local.bio === 'string' && local.bio.length >= bio.length) bio = local.bio
        }
      } catch (e) { /* no local copy */ }
    }
    data.status === 'submitted' ? screenReview() : screenWelcome()
  }
  boot()
})()
</script>
</body>
</html>
